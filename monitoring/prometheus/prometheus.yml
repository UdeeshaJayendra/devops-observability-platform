global:
  scrape_interval: 5s

rule_files:
  - "/etc/prometheus/alert-rules.yml"
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "observability-demo-app"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["observability-demo-app:3000"]

  - job_name: "cadvisor"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "windows"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:9182"]