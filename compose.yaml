services:

  observability-demo-app:
    build:
      context: ./app
    container_name: observability-demo-app
    ports:
      - "8081:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    container_name: observability-prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerting/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - observability-demo-app

  alertmanager:
    image: prom/alertmanager:latest
    container_name: observability-alertmanager
    ports:
      - "9093:9093"
    restart: unless-stopped
    volumes:
      - ./alerting/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    depends_on:
      - prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: observability-grafana
    ports:
      - "3100:3000"
    restart: unless-stopped
    depends_on:
      - prometheus
    volumes:
      - ./dashboards/json:/var/lib/grafana/dashboards:ro
      - ./dashboards/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - grafana-data:/var/lib/grafana

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: observability-cadvisor
    ports:
      - "8082:8080"
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  loki:
    image: grafana/loki:latest
    container_name: observability-loki
    ports:
      - "3101:3100"
    restart: unless-stopped
    volumes:
      - ./logging/loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/config.yml

  alloy:
    image: grafana/alloy:latest
    container_name: observability-alloy
    ports:
      - "12345:12345"
    restart: unless-stopped
    volumes:
      - ./logging/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    depends_on:
      - loki

  tempo:
    image: grafana/tempo:latest
    container_name: observability-tempo
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped
    volumes:
      - ./tracing/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    command:
      - "-config.file=/etc/tempo.yaml"

volumes:
  loki-data:
  prometheus-data:
  grafana-data:
  tempo-data: