services:

  observability-demo-app:
    build:
      context: ./app
    container_name: observability-demo-app
    ports:
      - "8081:3000"

  prometheus:
    image: prom/prometheus:latest
    container_name: observability-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - observability-demo-app