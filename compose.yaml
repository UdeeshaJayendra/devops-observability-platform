services:

  observability-demo-app:
    build:
      context: ./app
    container_name: observability-demo-app
    ports:
      - "8081:3000"

  prometheus:
    image: prom/prometheus:latest
    container_name: observability-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerting/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    depends_on:
      - observability-demo-app

  alertmanager:
    image: prom/alertmanager:latest
    container_name: observability-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alerting/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    depends_on:
      - prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: observability-grafana
    ports:
      - "3100:3000"
    depends_on:
      - prometheus

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: observability-cadvisor
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  loki:
    image: grafana/loki:latest
    container_name: observability-loki
    ports:
      - "3101:3100"
    volumes:
      - ./logging/loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/config.yml

  alloy:
    image: grafana/alloy:latest
    container_name: observability-alloy
    ports:
      - "12345:12345"
    volumes:
      - ./logging/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    depends_on:
      - loki

volumes:
  loki-data: